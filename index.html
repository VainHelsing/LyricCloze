<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="中文与日语歌词词格生成器">
  <title>词格</title>
  <style>
    :root{--paper:#e9ecef;--ink:#17191b;--muted:#697078;--line:#bcc2c8;--red:#b82420;--white:#f7f8f9;--soft:#dfe3e7}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC","Yu Mincho","Hiragino Mincho ProN",Georgia,serif}button,textarea,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:3px}
    header{height:70px;padding:0 clamp(22px,6vw,92px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:22px;letter-spacing:.2em;font-weight:700}.brand b,h1 b{color:var(--red)}.local{font-size:11px;color:var(--muted);letter-spacing:.08em;display:flex;align-items:center;gap:8px}.local i{width:6px;height:6px;background:var(--red);border-radius:50%}
    .hero{padding:72px clamp(22px,8vw,128px) 92px;border-bottom:1px solid var(--line)}h1{margin:0 0 16px;font-size:clamp(64px,10vw,128px);line-height:1;font-weight:500;letter-spacing:.08em}.intro{max-width:620px;margin:0 0 36px;color:#505860;line-height:1.85;font-size:15px}.composer{max-width:980px;background:var(--white);border:1px solid #9da4ab;box-shadow:9px 9px 0 #17191b12}.bar,.foot{display:flex;align-items:center;justify-content:space-between;padding:15px 18px}.bar{border-bottom:1px solid var(--line)}.bar label{font-size:13px;font-weight:700;letter-spacing:.08em}.action-link{border:0;background:none;padding:4px;color:var(--red);font-size:12px;text-decoration:underline;text-underline-offset:4px}.language{display:inline-flex;border:1px solid var(--ink);margin-bottom:20px}.language button{border:0;background:transparent;padding:10px 24px;font-size:13px}.language button+button{border-left:1px solid var(--ink)}.language button.active{background:var(--ink);color:#fff}.hint{display:block;margin:0 0 10px;color:var(--muted);font-size:12px}.lyrics{width:100%;min-height:310px;resize:vertical;border:0;background:transparent;padding:20px 22px;font-size:16px;line-height:1.8;color:var(--ink)}.lyrics::placeholder{color:#858d95;opacity:.76}.lyrics:focus{outline-offset:-3px}.foot{border-top:1px solid var(--line);gap:22px}.foot p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.primary{flex:none;border:0;padding:13px 18px;background:var(--ink);color:#fff;letter-spacing:.05em;font-size:13px}.primary:hover{background:var(--red)}.primary span{color:#ed625b;margin-left:28px}
    .results{padding:84px clamp(22px,8vw,128px) 110px}.section-head{max-width:1180px;margin:0 auto 34px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{color:var(--red);font:700 10px Georgia,serif;letter-spacing:.2em}h2{margin:9px 0 0;font-size:clamp(34px,5vw,58px);font-weight:500;letter-spacing:-.04em}.outline{border:1px solid var(--ink);background:transparent;padding:11px 16px;font-size:12px}.outline:hover:not(:disabled){background:var(--ink);color:#fff}.outline:disabled{opacity:.35;cursor:default}.notice,.empty{max-width:1180px;margin:0 auto 20px;padding:14px 17px;border-left:3px solid var(--red);background:var(--soft);color:#555d64;font-size:13px;line-height:1.6}.notice b{color:var(--red)}.sheets{max-width:1180px;margin:0 auto;display:grid;gap:22px}.sheet{border:1px solid #9da4ab;background:var(--white)}.sheet-head{min-height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:16px}.sheet-index{font:italic 19px Georgia,serif;color:var(--red)}.sheet-actions{display:flex;align-items:center;gap:14px}.original{padding:20px 20px 0;font-size:19px;line-height:1.7;letter-spacing:.04em}.original small{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;letter-spacing:.15em}.token-wrap{padding:20px;display:flex;flex-wrap:wrap;gap:15px 8px;align-items:start}.pair{width:47px;display:grid;gap:6px;text-align:center}.pair.word-end{margin-right:14px}.reading{height:25px;display:flex;align-items:end;justify-content:center;font-size:16px;white-space:nowrap}.roman{height:15px;color:var(--muted);font:10px Georgia,serif;white-space:nowrap}.pair input{width:47px;height:40px;padding:0;border:1px solid #858d95;background:#eef0f2;border-radius:0;text-align:center;font-size:14px}.pair input:focus{border-color:var(--red);background:#fff;outline-offset:1px}.align-warning{margin:0 20px 18px;padding:8px 11px;background:#eee0e0;color:#7b3e39;font-size:11px}.notes{display:none;border-top:1px solid var(--line);padding:16px 18px 18px;background:#e2e6e9}.notes.open{display:block}.notes-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:9px;color:var(--muted);font-size:11px}.note-box{width:100%;min-height:108px;padding:13px 14px;border:1px solid #9da4ab;background:var(--white);resize:vertical;font-size:14px;line-height:1.75;color:var(--ink)}
    .menu{display:none;position:fixed;z-index:20;min-width:152px;padding:5px;background:var(--ink);box-shadow:0 8px 25px #0003}.menu.show{display:block}.menu button{width:100%;padding:9px 11px;border:0;background:transparent;color:#fff;text-align:left;font-size:12px}.menu button:hover{background:var(--red)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}footer{border-top:1px solid var(--line);padding:28px clamp(22px,6vw,92px);display:flex;justify-content:space-between;gap:22px;color:var(--muted);font-size:10px;letter-spacing:.08em}footer b{color:var(--ink)}footer p{margin:0}
    @media(max-width:640px){.local{display:none}.hero{padding-top:52px}.language{display:flex}.language button{flex:1}.foot,.section-head{align-items:stretch;flex-direction:column}.primary,.outline{width:100%}.primary{display:flex;justify-content:space-between}.results{padding-top:64px}.sheet-head{align-items:flex-start;padding-top:14px;padding-bottom:14px}.sheet-actions{align-items:flex-end;flex-direction:column;gap:7px}.token-wrap{padding:16px 14px}.original{padding:16px 14px 0}footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
  <header><div class="brand"><b>词</b>格</div><div class="local"><i></i> 本地处理 · 内容不会上传</div></header>
  <main>
    <section class="hero">
      <h1><b>词</b>格</h1>
      <p class="intro">选择歌曲的原始语言，再粘贴歌词。中文按字生成；日语以读音音节为准，将原文、假名与罗马音整理在同一组里。</p>
      <div class="language" role="group" aria-label="歌曲语言"><button class="active" data-lang="ja">日语</button><button data-lang="zh">中文</button></div>
      <span class="hint" id="format-hint">每个分句一组：日文原文、假名、罗马音各占一行，组间留空行；中文翻译会忽略。</span>
      <div class="composer">
        <div class="bar"><label for="lyrics">粘贴歌词</label></div>
        <textarea class="lyrics" id="lyrics" spellcheck="false"></textarea>
        <div class="foot"><p id="parse-note">日语词格依据读音音节生成。若假名与罗马音数量不同，会提示检查。</p><button class="primary" id="generate">生成词格 <span>↘</span></button></div>
      </div>
    </section>
    <section class="results" id="results">
      <div class="section-head"><div><div class="eyebrow">GENERATED · 生成结果</div><h2>词格</h2></div><button class="outline" id="copy-all">复制全部 Markdown</button></div>
      <div id="status"></div><div class="sheets" id="sheets"></div>
    </section>
  </main>
  <footer><b>词格</b><p>备注保存在当前浏览器。双击备注中的一行可复制；选中文字后右键可填入该分句。</p></footer>
  <div class="menu" id="selection-menu"><button id="fill-selection">填入当前分句</button></div>
  <div class="toast" id="toast"></div>
  <script>
    const SAMPLES={ja:`天　地　星　空　山　川
ame tsuchi hoshi sora yama kawa
峰　谷　雲　霧　室　苔
mine tani kumo kiri muro koke

人　犬　上　末　硫黄　猿
hito inu ue sue yuwa saru
生せよ　榎の枝を　馴れ居て
ofuseyo e no e o narewite

願わくば　一切成就の　祓　奉る
negawakuba issai jōju no harae tatematsuru
恐み　恐みも　白す
kashikomi kashikomi mo mōsu`,zh:`晚风轻敲窗边
想起你的声音

月光落在旧街`};
    const SMALL=new Set(Array.from('ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ'));
    const UNITS=`kya kyu kyo gya gyu gyo sha shu sho sya syu syo jya jyu jyo cha chu cho tya tyu tyo nya nyu nyo hya hyu hyo bya byu byo pya pyu pyo mya myu myo rya ryu ryo shi chi tsu ja ju jo fu ka ki ku ke ko ga gi gu ge go sa su se so za ji zu ze zo ta te to da de do na ni nu ne no ha hi he ho ba bi bu be bo pa pi pu pe po ma mi mu me mo ya yu yo ra ri ru re ro wa wi we wo a i u e o n`.split(' ');
    const $=s=>document.querySelector(s);let language='ja',groups=[],answers={},menuState=null;
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function splitRomajiWord(raw){let word=raw.toLowerCase().replace(/ā/g,'aa').replace(/ī/g,'ii').replace(/ū/g,'uu').replace(/ē/g,'ee').replace(/ō/g,'ou').replace(/[^a-z'-]/g,'').replace(/[’-]/g,''),out=[];while(word){if(word.length>1&&word[0]===word[1]&&/[bcdfghjkmprstz]/.test(word[0])){out.push(word[0]);word=word.slice(1);continue}const unit=UNITS.find(x=>word.startsWith(x));if(!unit)return null;out.push(unit);word=word.slice(unit.length)}return out.length?out:null}
    function romajiTokens(line){const latin='A-Za-zĀĪŪĒŌāīūēō',words=line.trim().split(/\s+/).map(x=>x.replace(new RegExp(`^[^${latin}]+|[^${latin}'-]+$`,'g'),'')).filter(Boolean),parts=words.map(splitRomajiWord);return words.length&&!parts.some(x=>!x)?words:null}
    function romajiSyllables(word){const chars=Array.from(word.toLowerCase().replace(/[^a-zāīūēō]/g,'')),vowel=c=>/[aeiouāīūēō]/.test(c),plain=c=>({ā:'a',ī:'i',ū:'u',ē:'e',ō:'o'}[c]||c),out=[];let i=0;while(i<chars.length){if(i+1<chars.length&&chars[i]===chars[i+1]&&!vowel(chars[i])&&chars[i]!=='n'){if(out.length)out[out.length-1]+=chars[i];else out.push(chars[i]);i++;continue}if(chars[i]==='n'&&(i===chars.length-1||!vowel(chars[i+1]))){if(out.length)out[out.length-1]+='n';else out.push('n');i++;continue}const start=i;let onset=false;while(i<chars.length&&!vowel(chars[i])){onset=true;i++}if(i<chars.length)i++;if(onset&&i<chars.length&&vowel(chars[i])&&/[aeo]/.test(plain(chars[i-1]))&&/[iu]/.test(plain(chars[i]))&&(i+1===chars.length||!vowel(chars[i+1])))i++;if(i===start)i++;out.push(chars.slice(start,i).join(''))}return out}
    function romajiMora(line){const words=romajiTokens(line)||[],mora=[],wordEnds=[];for(const word of words){const pieces=romajiSyllables(word);pieces.forEach((piece,i)=>{mora.push(piece);wordEnds.push(i===pieces.length-1)})}return{words,mora,wordEnds}}
    function kanaTokens(line){const out=[];for(const ch of Array.from(line)){if(!/[\u3040-\u30ffー]/u.test(ch))continue;if(SMALL.has(ch)&&out.length)out[out.length-1]+=ch;else out.push(ch)}return out}
    function hanTokens(line){return Array.from(line).filter(ch=>/\p{Script=Han}/u.test(ch))}
    function parseJapanese(text){const out=[];let ignored=0,current={original:'',kana:'',romanLine:''};const flush=()=>{const{original,kana,romanLine}=current;if(!original&&!kana&&!romanLine)return;const reading=romanLine?romajiMora(romanLine):{words:[],mora:[],wordEnds:[]},originalParts=original.split(/\s+/).filter(Boolean);let tokens=[],display=[],shownRoman=[],wordEnds=[],label='假名',alignmentIssue=false;if(kana){tokens=kanaTokens(kana);display=tokens;shownRoman=reading.mora;wordEnds=reading.wordEnds;alignmentIssue=!!reading.mora.length&&reading.mora.length!==tokens.length}else if(reading.mora.length){tokens=reading.mora;wordEnds=reading.wordEnds;if(originalParts.length>1&&originalParts.length===reading.words.length){display=Array(tokens.length).fill('');let cursor=0;reading.words.forEach((word,i)=>{display[cursor]=originalParts[i];cursor+=(splitRomajiWord(word)||[]).length});shownRoman=reading.mora;label='日文'}else{display=tokens;label='罗马音'}}else if(original){tokens=kanaTokens(original);display=tokens;label='假名'}if(tokens.length)out.push({id:`g${out.length}`,original:original||kana,kana:tokens,display,roman:shownRoman,wordEnds,label,alignmentIssue});else ignored++;current={original:'',kana:'',romanLine:''}};text.split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line){flush();return}const hasKana=/[\u3040-\u30ff]/u.test(line),hasHan=/\p{Script=Han}/u.test(line),hasLatin=/[A-Za-z]/.test(line);if(hasLatin&&!hasKana&&!hasHan){const roman=romajiTokens(line);if(!roman){ignored++;return}if(current.romanLine)flush();current.romanLine=line;return}if(hasKana&&!hasHan){if(current.romanLine)flush();if(current.kana)flush();current.kana=line;return}if(hasKana||hasHan){if(current.romanLine||current.original)flush();current.original=line;return}ignored++});flush();return{groups:out,ignored}}
    function parseChinese(text){const out=[];let ignored=0;text.split(/\r?\n/).forEach(line=>{if(!line.trim())return;const tokens=hanTokens(line);if(tokens.length&&!/[A-Za-z\u3040-\u30ff]/u.test(line))out.push({id:`g${out.length}`,original:line.trim(),kana:tokens,roman:[]});else ignored++});return{groups:out,ignored}}
    function noteKey(index){return`cige-note-${language}-${index}`}
    function parseCurrent(){return language==='ja'?parseJapanese($('#lyrics').value):parseChinese($('#lyrics').value)}
    function render(scroll=true){const parsed=parseCurrent();groups=parsed.groups;answers={};$('#copy-all').disabled=!groups.length;$('#status').innerHTML=parsed.ignored?`<div class="notice"><b>${parsed.ignored}</b> 行未用于词格：${language==='ja'?'英文释义、普通英文或无法对应的内容已忽略。':'非中文内容已忽略。'}</div>`:groups.length?'':'<div class="empty">没有识别到可生成的歌词。</div>';$('#sheets').innerHTML=groups.map((group,g)=>`<article class="sheet" data-group="${g}"><div class="sheet-head"><span class="sheet-index">${String(g+1).padStart(2,'0')}</span><div class="sheet-actions"><button class="action-link" data-note-toggle="${g}">＋ 备注</button><button class="action-link" data-copy-group="${g}">复制本句</button></div></div><div class="original"><small>${language==='ja'?'日文原句':'中文原句'}</small>${esc(group.original)}</div><div class="token-wrap">${group.kana.map((token,i)=>`<label class="pair ${group.wordEnds?.[i]?'word-end':''}"><span class="reading">${esc(group.display?.[i]??token)}</span><span class="roman">${esc(group.roman[i]||'')}</span><input data-group-input="${g}" data-index="${i}" data-limit="${Array.from(token).length}" maxlength="${Math.max(8,Array.from(token).length)}" aria-label="第${i+1}格" autocomplete="off"></label>`).join('')}</div>${group.alignmentIssue?`<div class="align-warning">假名与罗马音的音节数量不同；词格已按假名生成，请检查这一句。</div>`:''}<div class="notes" id="note-${g}"><div class="notes-head"><span>备注 / 思考</span><span>双击复制当前行 · 选中文字后右键填入</span></div><textarea class="note-box" data-note="${g}" placeholder="在这里写下联想、译意或记忆提示……">${esc(localStorage.getItem(noteKey(g))||'')}</textarea></div></article>`).join('');if(scroll)$('#results').scrollIntoView({behavior:'smooth'})}
    function markdownFor(group,g){const blocks=[];for(let start=0;start<group.kana.length;start+=12){const tokens=group.kana.slice(start,start+12),display=(group.display||group.kana).slice(start,start+12),roman=group.roman.slice(start,start+12),filled=tokens.map((_,i)=>answers[`${g}-${start+i}`]||'＿');if(language==='ja')blocks.push(`原文：${group.original}\n\n| ${group.label||'日文'} | ${display.join(' | ')} |\n| :--- | ${tokens.map(()=>':---:').join(' | ')} |${roman.length?`\n| 罗马音 | ${tokens.map((_,i)=>roman[i]||'').join(' | ')} |`:''}\n| 填空 | ${filled.join(' | ')} |`);else blocks.push(`| 中文 | ${tokens.join(' | ')} |\n| :--- | ${tokens.map(()=>':---:').join(' | ')} |\n| 填空 | ${filled.join(' | ')} |`)}const note=localStorage.getItem(noteKey(g));return blocks.join('\n\n')+(note?`\n\n> 备注：${note.replace(/\n/g,'\n> ')}`:'')}
    function allMarkdown(){return groups.map((group,g)=>markdownFor(group,g)).join('\n\n---\n\n')}
    async function copy(text,message='已复制'){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity=0;document.body.append(t);t.select();document.execCommand('copy');t.remove()}showToast(message)}
    function showToast(text){$('#toast').textContent=text;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1500)}
    function setLanguage(next){language=next;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===next));$('#format-hint').textContent=next==='ja'?'日文与罗马音各占一行；已有空格会作为对应分组，没有假名也可以识别。':'每个中文分句占一行；非中文内容不会读取。';$('#parse-note').textContent=next==='ja'?'示例仅作为灰色提示，不会成为输入内容。英文翻译不会读取。':'中文词格按汉字逐格生成，标点不会生成格子。';$('#lyrics').value='';$('#lyrics').placeholder=SAMPLES[next];groups=[];answers={};$('#sheets').innerHTML='';$('#status').innerHTML='';$('#copy-all').disabled=true}
    function selectionUnits(text){if(language==='zh')return hanTokens(text);const kana=kanaTokens(text);if(kana.length)return kana;const roman=romajiTokens(text);return roman||Array.from(text.replace(/\s+/g,''))}
    function fillFromSelection(){if(!menuState)return;const units=selectionUnits(menuState.text),inputs=[...document.querySelectorAll(`[data-group-input="${menuState.group}"]`)];let cursor=0;for(const input of inputs){if(!input.value&&cursor<units.length){input.value=units[cursor];answers[`${menuState.group}-${input.dataset.index}`]=units[cursor];cursor++}}hideMenu();showToast(`已填入 ${cursor} 格`)}
    function hideMenu(){$('#selection-menu').classList.remove('show');menuState=null}
    document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));$('#generate').onclick=()=>render();$('#copy-all').onclick=()=>copy(allMarkdown(),'全部 Markdown 已复制');$('#fill-selection').onclick=fillFromSelection;
    $('#sheets').addEventListener('click',e=>{const toggle=e.target.closest('[data-note-toggle]'),copyButton=e.target.closest('[data-copy-group]');if(toggle){const g=+toggle.dataset.noteToggle,note=$(`#note-${g}`),open=note.classList.toggle('open');toggle.textContent=open?'－ 收起备注':'＋ 备注';if(open)note.querySelector('textarea').focus()}if(copyButton){const g=+copyButton.dataset.copyGroup;copy(markdownFor(groups[g],g),'本句 Markdown 已复制')}});
    $('#sheets').addEventListener('input',e=>{const input=e.target.closest('[data-group-input]'),note=e.target.closest('[data-note]');if(note){localStorage.setItem(noteKey(+note.dataset.note),note.value);return}if(!input)return;const g=+input.dataset.groupInput,i=+input.dataset.index,limit=+input.dataset.limit,key=`${g}-${i}`;input.value=Array.from(input.value).slice(0,Math.max(3,limit)).join('');answers[key]=input.value;if(!e.isComposing&&Array.from(input.value).length>=limit){const next=input.closest('.pair').nextElementSibling?.querySelector('input');if(next)next.focus()}});
    $('#sheets').addEventListener('keydown',e=>{const input=e.target.closest('[data-group-input]');if(!input)return;const pair=input.closest('.pair');if(e.key==='ArrowLeft'||(e.key==='Backspace'&&!input.value))pair.previousElementSibling?.querySelector('input')?.focus();if(e.key==='ArrowRight')pair.nextElementSibling?.querySelector('input')?.focus()});
    $('#sheets').addEventListener('dblclick',e=>{const note=e.target.closest('[data-note]');if(!note)return;const pos=note.selectionStart,before=note.value.lastIndexOf('\n',Math.max(0,pos-1))+1,after=note.value.indexOf('\n',pos),line=note.value.slice(before,after<0?note.value.length:after);if(line.trim())copy(line,'当前行已复制')});
    $('#sheets').addEventListener('contextmenu',e=>{const note=e.target.closest('[data-note]');if(!note||note.selectionStart===note.selectionEnd)return;const text=note.value.slice(note.selectionStart,note.selectionEnd).trim();if(!text)return;e.preventDefault();menuState={group:+note.dataset.note,text};const menu=$('#selection-menu'),x=Math.min(e.clientX,innerWidth-170),y=Math.min(e.clientY,innerHeight-55);menu.style.left=`${x}px`;menu.style.top=`${y}px`;menu.classList.add('show')});
    document.addEventListener('click',e=>{if(!e.target.closest('#selection-menu'))hideMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideMenu()});setLanguage('ja');window.scrollTo(0,0);
  </script>
</body>
</html>
